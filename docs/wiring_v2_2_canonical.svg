<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Minimum outdoor delivery robot wiring diagram">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #24313f; stroke-width: 2; rx: 10; }
      .power { stroke: #c62828; stroke-width: 4; fill: none; marker-end: url(#arrow-red); }
      .ground { stroke: #222222; stroke-width: 4; fill: none; marker-end: url(#arrow-black); }
      .logic { stroke: #1565c0; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .signal { stroke: #2e7d32; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .label { font: 18px Arial, sans-serif; fill: #16202a; }
      .small { font: 14px Arial, sans-serif; fill: #16202a; }
      .tiny { font: 12px Arial, sans-serif; fill: #16202a; }
      .warn { font: 15px Arial, sans-serif; fill: #b71c1c; font-weight: bold; }
    </style>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#c62828"/></marker>
    <marker id="arrow-black" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#222222"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#1565c0"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#2e7d32"/></marker>
  </defs>

  <text x="40" y="42" class="label" style="font-size:28px;font-weight:bold">Minimum Outdoor Delivery Robot Wiring</text>
  <text x="40" y="70" class="warn">No solderless breadboard. Fuse stays close to battery positive. Use drip loops and grommets outdoors.</text>

  <rect class="box" x="40" y="115" width="150" height="70"/>
  <text class="label" x="62" y="147">3S LiPo</text>
  <text class="small" x="62" y="169">XT60, 11.1 V</text>

  <rect class="box" x="245" y="115" width="130" height="70"/>
  <text class="label" x="281" y="147">Fuse</text>
  <text class="small" x="267" y="169">25 A blade</text>

  <rect class="box" x="430" y="115" width="150" height="70"/>
  <text class="label" x="455" y="147">Switch</text>
  <text class="small" x="448" y="169">or XT60 key</text>

  <rect class="box" x="650" y="100" width="260" height="100"/>
  <text class="label" x="702" y="135">Power Distribution</text>
  <text class="small" x="683" y="160">positive and negative blocks</text>
  <text class="tiny" x="700" y="182">common ground, real terminals</text>

  <path class="power" d="M190 137 H245"/>
  <path class="power" d="M375 137 H430"/>
  <path class="power" d="M580 137 H650"/>
  <path class="ground" d="M190 170 C320 240, 520 240, 650 173"/>

  <rect class="box" x="70" y="315" width="220" height="105"/>
  <text class="label" x="112" y="348">4 x BTS7960</text>
  <text class="small" x="103" y="372">one driver per motor</text>
  <text class="tiny" x="103" y="396">B+ and B- from distribution</text>

  <rect class="box" x="385" y="310" width="220" height="115"/>
  <text class="label" x="448" y="343">Arduino Mega</text>
  <text class="small" x="424" y="368">serial drive pulses</text>
  <text class="small" x="424" y="388">stop and battery cutoff</text>

  <rect class="box" x="710" y="318" width="210" height="88"/>
  <text class="label" x="755" y="352">5 V Buck</text>
  <text class="small" x="747" y="376">Arduino and BTS logic</text>

  <rect class="box" x="950" y="305" width="190" height="125"/>
  <text class="label" x="990" y="338">4 Motors</text>
  <text class="small" x="982" y="364">M+ and M- from</text>
  <text class="small" x="982" y="384">BTS7960 outputs</text>

  <path class="power" d="M780 200 V318"/>
  <path class="power" d="M780 200 C745 275, 310 286, 180 315"/>
  <path class="logic" d="M710 362 H605"/>
  <path class="signal" d="M605 362 H710"/>
  <path class="power" d="M290 360 H950"/>

  <rect class="box" x="160" y="555" width="245" height="95"/>
  <text class="label" x="218" y="588">Battery Sense</text>
  <text class="small" x="190" y="612">100k / 33k divider to A0</text>
  <text class="tiny" x="200" y="634">sense only, powers nothing</text>

  <rect class="box" x="475" y="555" width="285" height="95"/>
  <text class="label" x="552" y="588">External Stop</text>
  <text class="small" x="510" y="612">D42 normally closed to GND</text>
  <text class="tiny" x="514" y="634">pressed or broken wire = lockout</text>

  <path class="signal" d="M405 604 H475"/>
  <path class="signal" d="M617 555 V425"/>

  <text class="tiny" x="42" y="720">Red = battery power, black = ground, blue = regulated 5 V logic, green = Arduino signal.</text>
</svg>
